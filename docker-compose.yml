services:
  mysql:
    image: mysql:8.0
    container_name: eduqa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: eduqa_root
      MYSQL_DATABASE: eduqa
      MYSQL_USER: eduqa
      MYSQL_PASSWORD: eduqa
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-peduqa_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: eduqa-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes

volumes:
  mysql_data:
